name: Update catalog and movers

on:
  push:
    branches:
      - main
    paths:
      - "readme.md"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-enrichment
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build enriched catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_catalog.py --readme readme.md --output data/catalog.json

      - name: Generate weekly Movers & Shakers digest
        run: python3 scripts/movers_digest.py --catalog data/catalog.json --output data/movers.md

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-movers-digest
          path: data/movers.md

      - name: Commit updated catalog and digest
        id: commit_data
        run: |
          if git diff --quiet data/catalog.json data/movers.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/movers.md
          git commit -m "Update catalog metadata and movers digest"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch rebuild to awesome-aeco.github.io
        if: steps.commit_data.outputs.changed == 'true' || github.event_name == 'push'
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN secret is not configured; skipping repository_dispatch."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/awesome-aeco/awesome-aeco.github.io/dispatches \
            -d '{"event_type":"sync-awesome-data","client_payload":{"ref":"main"}}'

      - name: Track archived repositories in a maintenance issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, subprocess
          from pathlib import Path

          catalog = json.loads(Path("data/catalog.json").read_text(encoding="utf-8"))
          archived = [
              e for e in catalog.get("entries", [])
              if (e.get("github") or {}).get("archived") is True
          ]

          title = "[Maintenance] Archived repositories in readme.md"
          existing = json.loads(
              subprocess.check_output(
                  ["gh", "issue", "list", "--state", "open", "--search", f'"{title}" in:title', "--json", "number,title"],
                  text=True,
              )
          )
          match = next((i for i in existing if i["title"] == title), None)

          if not archived:
              if match:
                  subprocess.check_call([
                      "gh", "issue", "close", str(match["number"]),
                      "--comment", "All listed GitHub repositories are currently active (0 archived). Closing automatically."
                  ])
              raise SystemExit(0)

          lines = [
              f"Detected **{len(archived)}** archived GitHub repository/repositories in `readme.md` (catalog snapshot `{catalog.get('generated_at', '')}`):",
              "",
          ]
          for e in archived:
              url = e.get("github_url") or e.get("website") or ""
              lines.append(f"- **[{e['name']}]({url})** (*{e['category']}*) — consider updating to an active replacement or noting its archived status.")
          body = "\n".join(lines) + "\n"

          if match:
              subprocess.check_call(["gh", "issue", "edit", str(match["number"]), "--body", body])
          else:
              subprocess.check_call(["gh", "issue", "create", "--title", title, "--body", body])
          EOF

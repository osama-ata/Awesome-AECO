name: Update catalog and movers

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build enriched catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_catalog.py --readme readme.md --output data/catalog.json

      - name: Generate weekly Movers & Shakers digest
        run: python3 scripts/movers_digest.py --catalog data/catalog.json --output data/movers.md

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-movers-digest
          path: data/movers.md

      - name: Commit updated catalog and digest
        run: |
          if git diff --quiet data/catalog.json data/movers.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/movers.md
          git commit -m "Update weekly catalog metadata and movers digest"
          git push

name: Trigger website rebuild

on:
  push:
    branches:
      - main
    paths:
      - "data/catalog.json"
      - "data/movers.md"
      - "brand/**"
      - "badges/**"
      - "TRADEMARK.md"
      - "llms.txt"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch rebuild to awesome-aeco.github.io
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN secret is not configured yet; skipping repository_dispatch."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/awesome-aeco/awesome-aeco.github.io/dispatches \
            -d '{"event_type":"sync-awesome-data","client_payload":{"ref":"main"}}'

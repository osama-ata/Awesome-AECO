<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2256 382" width="2256" height="382" role="img" aria-label="Awesome AECO — Open-Source Hub for Architecture, Engineering, Construction and Operations">
  <title>Awesome AECO — LinkedIn Banner</title>
  <defs>
    <linearGradient id="liBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="58%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B3B59"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B6E99"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <!-- Background + Blueprint Grid -->
  <rect width="2256" height="382" fill="url(#liBg)"/>
  <rect width="2256" height="382" fill="url(#grid)"/>

  <!-- Subtle architectural border frame -->
  <rect x="24" y="24" width="2208" height="334" rx="16" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Subtle drafting crosshairs in left safe zone (clear of LinkedIn bottom-left logo overlap) -->
  <g stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.5">
    <line x1="88" y1="96" x2="120" y2="96"/>
    <line x1="104" y1="80" x2="104" y2="112"/>
    <circle cx="104" cy="96" r="24" fill="none" stroke-dasharray="4 6"/>
  </g>

  <!-- Main Content Block (starts at x=360 to stay safely clear of LinkedIn's bottom-left logo) -->
  <!-- Eyebrow Pill -->
  <rect x="360" y="54" width="356" height="36" rx="18" fill="#0B6E99" fill-opacity="0.35" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="538" y="77" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="1.8" fill="#7DD3FC">OPEN-SOURCE AECO ECOSYSTEM</text>

  <!-- Title -->
  <text x="360" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-1.6" fill="#F8FAFC">Awesome <tspan fill="#38BDF8">AECO</tspan></text>

  <!-- Subtitle -->
  <text x="360" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#CBD5E1">Curated open-source tools for Architecture, Engineering, Construction &amp; Operations</text>

  <!-- Domain Pills + Website URL -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">
    <rect x="360" y="254" width="132" height="38" rx="9" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <text x="426" y="279" text-anchor="middle">BIM &amp; IFC</text>

    <rect x="506" y="254" width="166" height="38" rx="9" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <text x="589" y="279" text-anchor="middle">CAD &amp; Parametric</text>

    <rect x="686" y="254" width="174" height="38" rx="9" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <text x="773" y="279" text-anchor="middle">Simulation &amp; FEA</text>

    <rect x="874" y="254" width="150" height="38" rx="9" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <text x="949" y="279" text-anchor="middle">Digital Twins</text>

    <rect x="1038" y="254" width="142" height="38" rx="9" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <text x="1109" y="279" text-anchor="middle">AI &amp; MCP</text>

    <rect x="1194" y="254" width="156" height="38" rx="9" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <text x="1272" y="279" text-anchor="middle">GIS &amp; Energy</text>
  </g>

  <!-- URL -->
  <text x="360" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="22" font-weight="600" fill="#7DD3FC">awesome-aeco.github.io</text>

  <!-- Right Emblem: Isometric BIM Cube -->
  <g transform="translate(1975,191)">
    <!-- Subtle halo -->
    <circle cx="0" cy="0" r="136" fill="#0B6E99" fill-opacity="0.16"/>
    <circle cx="0" cy="0" r="136" fill="none" stroke="#38BDF8" stroke-opacity="0.24" stroke-width="1.5" stroke-dasharray="6 8"/>
    <!-- Cube -->
    <polygon points="0,-104 90,-52 0,0 -90,-52" fill="url(#cubeTop)"/>
    <polygon points="-90,-52 0,0 0,104 -90,52" fill="url(#cubeLeft)"/>
    <polygon points="90,-52 0,0 0,104 90,52" fill="#1E293B"/>
    <!-- Floor-plate lines -->
    <polyline points="-90,-17 0,35 90,-17" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.55"/>
    <polyline points="-90,17 0,69 90,17" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.35"/>
    <!-- Crisp Wireframe -->
    <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52" fill="none" stroke="#E0F2FE" stroke-width="4.5" stroke-linejoin="round"/>
    <line x1="0" y1="0" x2="0" y2="104" stroke="#E0F2FE" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-90" y1="-52" x2="0" y2="0" stroke="#E0F2FE" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="90" y1="-52" x2="0" y2="0" stroke="#E0F2FE" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="#F8FAFC"/>
    <circle cx="0" cy="0" r="3.8" fill="#0B6E99"/>
  </g>
</svg>
